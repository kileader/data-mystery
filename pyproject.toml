[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "data-mystery"
version = "0.1.0"
description = "Generate reproducible synthetic data-analysis mysteries."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
datamystery = "datamystery.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
